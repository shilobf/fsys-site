# Render Blueprint: one free web service running the API and the SSR site (see start.mjs).
# Content, messages and uploads live in MongoDB Atlas (MONGODB_URI), since free instances have no persistent disk.
services:
  - type: web
    name: fsys-site
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/content
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
